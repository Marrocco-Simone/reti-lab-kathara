LAB_DESCRIPTION="DNS Lab with Routers - Separated Domains"
LAB_VERSION=2.0
LAB_AUTHOR="L. Ariemma, T. Caiazzi, G. Di Battista, M. Patrignani, M. Pizzonia, F. Ricci, M. Rimondini"
LAB_EMAIL=contact@kathara.org
LAB_WEB=http://www.kathara.org/

# =============================================================================
# TOPOLOGY:
#
#     Rete ROOT              Rete IT                   Rete NET
#   192.168.0.0/24        192.168.1.0/24           192.168.2.0/24
#         |                    |                         |
#     [dnsroot]        [dnsit] [dnsuni]         [dnsnet] [dnsstart]
#         |            [localuni] [pc1]         [localstart] [pc2]
#         |                    |                [api] [frontend] [llm]
#         |                    |                         |
#      [R_ROOT]-------------[R_IT]-------------------[R_NET]
#           \                                          /
#            \                                        /
#             +--------------------------------------+
#
# Link networks:
#   LINK_RI (R_ROOT <-> R_IT): 192.168.10.0/24
#   LINK_IN (R_IT <-> R_NET):  192.168.20.0/24
#   LINK_RN (R_ROOT <-> R_NET): 192.168.30.0/24
# =============================================================================

# --- Rete ROOT (192.168.0.0/24) - Root DNS domain ---
dnsroot[0]="ROOT"
dnsroot[image]="kathara/base"

# --- Rete IT (192.168.1.0/24) - .it domain ---
dnsit[0]="IT"
dnsit[image]="kathara/base"

dnsuni[0]="IT"
dnsuni[image]="kathara/base"

localuni[0]="IT"
localuni[image]="kathara/base"

pc1[0]="IT"
pc1[image]="kathara/base"

# --- Rete NET (192.168.2.0/24) - .net domain ---
dnsnet[0]="NET"
dnsnet[image]="kathara/base"

dnsstart[0]="NET"
dnsstart[image]="kathara/base"

localstart[0]="NET"
localstart[image]="kathara/base"

pc2[0]="NET"
pc2[image]="kathara/base"

# Backend API service (provides REST endpoints for testing)
api[0]="NET"
api[image]="dns-lab/api"

# Frontend service (queries backend and returns HTML)
frontend[0]="NET"
frontend[image]="dns-lab/frontend"

# LLM service (streaming AI responses)
llm[0]="NET"
llm[image]="dns-lab/llm"

# --- Routers ---
# Router ROOT: connects ROOT domain with R_IT and R_NET
r_root[0]="ROOT"
r_root[1]="LINK_RI"
r_root[2]="LINK_RN"

# Router IT: connects IT domain with R_ROOT and R_NET
r_it[0]="IT"
r_it[1]="LINK_RI"
r_it[2]="LINK_IN"

# Router NET: connects NET domain with R_IT and R_ROOT
r_net[0]="NET"
r_net[1]="LINK_IN"
r_net[2]="LINK_RN"

# Add wireshark to sniff packets
wireshark[bridged]=true
wireshark[port]="3000:3000"
wireshark[image]="lscr.io/linuxserver/wireshark"
