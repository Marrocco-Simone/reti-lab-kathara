LAB_DESCRIPTION="Lab 6 - OSPF and DHCP: 4 LANs, 8 routers"
LAB_VERSION=1.0

# =============================================================================
# TOPOLOGY
#
#                         ROOT 192.168.0.0/24
#                               |
#                            [r_root]
#                               | 10
#   IT 192.168.1.0/24      10 [r1]----10-----[r3] 10        NET 192.168.2.0/24
#          |          +-------/  |             |  \-------+        |
#       [r_it]-------+         10|             |10        +-----[r_net]
#                    +-------\   |             |   /------+
#                         10 [r2]----30-----[r4] 10
#                              \ 10      10 /
#                                 [r_home]
#                                    |
#                           HOME 192.168.3.0/24
#
# Numbers are OSPF costs (10 is the FRR default in Kathara). Link networks: 10.0.N.0/24 (see the LINK_* lines below).
# =============================================================================

# --- LANs: static hosts of lesson 5 ---
pc2[0]="NET"
pc2[image]="kathara/base"
pc3[0]="HOME"
pc3[image]="kathara/base"
dnsroot[0]="ROOT"
dnsroot[image]="kathara/base"
dnsit[0]="IT"
dnsit[image]="kathara/base"
dnsuni[0]="IT"
dnsuni[image]="kathara/base"
localuni[0]="IT"
localuni[image]="kathara/base"
dnsnet[0]="NET"
dnsnet[image]="kathara/base"
dnsstart[0]="NET"
dnsstart[image]="kathara/base"
localstart[0]="NET"
localstart[image]="kathara/base"
api[0]="NET"
api[image]="ghcr.io/marrocco-simone/reti-lab-kathara:api"
frontend[0]="NET"
frontend[image]="ghcr.io/marrocco-simone/reti-lab-kathara:frontend"
llm[0]="NET"
llm[image]="ghcr.io/marrocco-simone/reti-lab-kathara:llm"

# --- pc1: address from DHCP ---
pc1[0]="IT"
pc1[image]="kathara/base"

# --- DHCP server of the IT network ---
dhcp_it_1[0]="IT"
dhcp_it_1[image]="ghcr.io/marrocco-simone/reti-lab-kathara:dhcp"

# --- Routers (FRR with OSPF) ---
# LINK_ROOT_1  10.0.1.0/24   r_root .1  <->  r1 .2   cost 10
# LINK_IT_1    10.0.2.0/24   r_it .1  <->  r1 .2   cost 10
# LINK_IT_2    10.0.3.0/24   r_it .1  <->  r2 .2   cost 10
# LINK_1_2     10.0.4.0/24   r1 .1  <->  r2 .2   cost 10
# LINK_1_3     10.0.5.0/24   r1 .1  <->  r3 .2   cost 10
# LINK_2_4     10.0.6.0/24   r2 .1  <->  r4 .2   cost 30
# LINK_3_4     10.0.7.0/24   r3 .1  <->  r4 .2   cost 10
# LINK_3_NET   10.0.8.0/24   r3 .1  <->  r_net .2   cost 10
# LINK_4_NET   10.0.9.0/24   r4 .1  <->  r_net .2   cost 10
# LINK_4_HOME  10.0.10.0/24   r4 .1  <->  r_home .2   cost 10
# LINK_2_HOME  10.0.11.0/24   r2 .1  <->  r_home .2   cost 10
r_root[0]="ROOT"
r_root[1]="LINK_ROOT_1"
r_root[image]="kathara/frr"
r_it[0]="IT"
r_it[1]="LINK_IT_1"
r_it[2]="LINK_IT_2"
r_it[image]="kathara/frr"
r_net[0]="NET"
r_net[1]="LINK_3_NET"
r_net[2]="LINK_4_NET"
r_net[image]="kathara/frr"
r_home[0]="HOME"
r_home[1]="LINK_4_HOME"
r_home[2]="LINK_2_HOME"
r_home[image]="kathara/frr"
r1[0]="LINK_ROOT_1"
r1[1]="LINK_IT_1"
r1[2]="LINK_1_2"
r1[3]="LINK_1_3"
r1[image]="kathara/frr"
r2[0]="LINK_IT_2"
r2[1]="LINK_1_2"
r2[2]="LINK_2_4"
r2[3]="LINK_2_HOME"
r2[image]="kathara/frr"
r3[0]="LINK_1_3"
r3[1]="LINK_3_4"
r3[2]="LINK_3_NET"
r3[image]="kathara/frr"
r4[0]="LINK_2_4"
r4[1]="LINK_3_4"
r4[2]="LINK_4_NET"
r4[3]="LINK_4_HOME"
r4[image]="kathara/frr"

# Wireshark: start-lab.sh connects it to every network
wireshark[bridged]=true
wireshark[port]="3000:3000"
wireshark[image]="lscr.io/linuxserver/wireshark:4.6.5"
